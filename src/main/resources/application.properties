# 应用端口
server.port=8082

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 静态资源不缓存（改样式后刷新即可生效）
spring.web.resources.cache.cachecontrol.no-cache=true

# 后台数据导入：上传文件大小限制
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# 数据源（MySQL + Druid）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/credit_default?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 日志
logging.level.com.huike.creditrisk.mapper=debug
